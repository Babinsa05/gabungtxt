<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>TEST TXT Combiner - Simple Version</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #1e1e1e; color: white; padding: 15px; border-radius: 8px; overflow: auto; }
        .file-list { border: 1px solid #ccc; padding: 10px; min-height: 100px; margin: 10px 0; }
        .file-item { background: #e0e0e0; padding: 5px 10px; margin: 5px; display: flex; justify-content: space-between; }
        .status { background: #d4edda; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 TXT Combiner - TEST VERSION</h1>
    
    <div class="status" id="status">✅ Siap - Upload file TXT</div>
    
    <div>
        <button id="btnFile">📄 Pilih File TXT</button>
        <button id="btnClear">🗑️ Hapus Semua</button>
        <button id="btnDownload">⬇️ Download Hasil</button>
    </div>
    
    <h3>📁 File Terupload (<span id="fileCount">0</span>)</h3>
    <div id="fileList" class="file-list">📭 Belum ada file</div>
    
    <h3>📋 Hasil Gabungan</h3>
    <pre id="output">✨ Upload file TXT, akan digabung otomatis...</pre>
    
    <div id="info">📏 Total: 0 entri | 0 duplikat</div>
</div>

<script>
// Data store
let files = [];
let finalText = "";

// DOM elements
const outputEl = document.getElementById('output');
const fileListEl = document.getElementById('fileList');
const fileCountEl = document.getElementById('fileCount');
const infoEl = document.getElementById('info');

// Helper functions
function showMessage(msg, isError = false) {
    const statusEl = document.getElementById('status');
    statusEl.innerHTML = isError ? `⚠️ ${msg}` : `✅ ${msg}`;
    statusEl.style.background = isError ? '#f8d7da' : '#d4edda';
    setTimeout(() => {
        statusEl.innerHTML = '✅ Siap - Upload file TXT';
        statusEl.style.background = '#d4edda';
    }, 2000);
}

function parseEntries(content) {
    return content.split(/\r?\n/).filter(line => line.trim().length > 0);
}

function processCombine() {
    if (files.length === 0) {
        outputEl.innerHTML = '✨ Upload file TXT, akan digabung otomatis...';
        infoEl.innerHTML = '📏 Total: 0 entri | 0 duplikat';
        finalText = "";
        return;
    }
    
    outputEl.innerHTML = '🔄 Memproses...';
    
    // Gabungkan semua baris dari semua file
    let allLines = [];
    for (let f of files) {
        let lines = parseEntries(f.content);
        allLines.push(...lines);
    }
    
    // Hapus duplikat (case insensitive)
    let uniqueLines = [];
    let seen = new Set();
    for (let line of allLines) {
        let key = line.toLowerCase().trim();
        if (!seen.has(key)) {
            seen.add(key);
            uniqueLines.push(line);
        }
    }
    
    let duplicateCount = allLines.length - uniqueLines.length;
    
    // Urutkan berdasarkan tanggal jika ada
    function extractDate(line) {
        let match = line.match(/(\d{1,2})\s+(Januari|Februari|Maret|April|Mei|Juni|Juli|Agustus|September|Oktober|November|Desember)\s+(\d{4})/i);
        if (match) {
            let bulanMap = { januari:1, februari:2, maret:3, april:4, mei:5, juni:6, juli:7, agustus:8, september:9, oktober:10, november:11, desember:12 };
            return new Date(parseInt(match[3]), bulanMap[match[2].toLowerCase()]-1, parseInt(match[1]));
        }
        return null;
    }
    
    let sortedLines = [...uniqueLines].sort((a, b) => {
        let dateA = extractDate(a);
        let dateB = extractDate(b);
        if (!dateA && !dateB) return 0;
        if (!dateA) return 1;
        if (!dateB) return -1;
        return dateA - dateB;
    });
    
    finalText = sortedLines.join('\n');
    outputEl.innerHTML = finalText || '(kosong)';
    infoEl.innerHTML = `📏 Total: ${sortedLines.length} entri | ${duplicateCount} duplikat dihapus`;
    
    showMessage(`Selesai! ${sortedLines.length} entri, ${duplicateCount} duplikat`);
}

function renderFileList() {
    fileCountEl.innerText = files.length;
    
    if (files.length === 0) {
        fileListEl.innerHTML = '📭 Belum ada file';
        return;
    }
    
    fileListEl.innerHTML = files.map((f, idx) => `
        <div class="file-item">
            <span>📄 ${escapeHtml(f.name)}</span>
            <button onclick="removeFile(${idx})" style="background:#fee; border:none; padding:2px 10px; border-radius:5px; cursor:pointer;">Hapus</button>
        </div>
    `).join('');
}

function escapeHtml(str) {
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}

function removeFile(index) {
    files.splice(index, 1);
    renderFileList();
    processCombine();
    showMessage('File dihapus');
}

async function addFile(file) {
    if (!file.name.endsWith('.txt')) {
        showMessage(`${file.name} bukan file TXT!`, true);
        return false;
    }
    
    if (files.some(f => f.name === file.name)) {
        showMessage(`${file.name} sudah ada!`, true);
        return false;
    }
    
    const reader = new FileReader();
    reader.onload = async (e) => {
        const content = e.target.result;
        files.push({ name: file.name, content: content });
        renderFileList();
        processCombine();
        showMessage(`${file.name} ditambahkan`);
    };
    reader.readAsText(file, "UTF-8");
    return true;
}

// Event handlers
document.getElementById('btnFile').onclick = () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;
    input.accept = '.txt';
    input.onchange = (e) => {
        for (let file of e.target.files) {
            addFile(file);
        }
    };
    input.click();
};

document.getElementById('btnClear').onclick = () => {
    if (files.length > 0 && confirm(`Hapus semua ${files.length} file?`)) {
        files = [];
        finalText = "";
        renderFileList();
        processCombine();
        showMessage('Semua file dihapus');
    }
};

document.getElementById('btnDownload').onclick = () => {
    if (!finalText) {
        showMessage('Tidak ada hasil untuk di-download!', true);
        return;
    }
    
    const blob = new Blob([finalText], { type: 'text/plain' });
    const link = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    link.href = URL.createObjectURL(blob);
    link.download = `Hasil_Gabungan_${date}.txt`;
    link.click();
    URL.revokeObjectURL(link.href);
    showMessage('Download dimulai!');
};

// Drag & drop
const dropZone = document.querySelector('.container');
dropZone.ondragover = (e) => {
    e.preventDefault();
    dropZone.style.background = '#e8f4fd';
};
dropZone.ondragleave = () => {
    dropZone.style.background = 'white';
};
dropZone.ondrop = async (e) => {
    e.preventDefault();
    dropZone.style.background = 'white';
    
    const items = e.dataTransfer.items;
    for (let i = 0; i < items.length; i++) {
        const entry = items[i].webkitGetAsEntry();
        if (entry && entry.isFile) {
            const file = await new Promise(resolve => entry.file(resolve));
            if (file.name.endsWith('.txt')) {
                await addFile(file);
            } else {
                showMessage(`${file.name} bukan TXT`, true);
            }
        }
    }
};

console.log('✅ Test version siap!');
</script>
</body>
</html>
